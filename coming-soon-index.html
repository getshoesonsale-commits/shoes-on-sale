<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shoes On Sale — Coming Soon</title>
<meta name="description" content="Shoes On Sale is launching soon — the best shoe deals and coupons from your favorite brands, all in one place." />
<style>
  :root {
    --navy: #24344D;
    --coral: #E1553A;
    --grey: #6B7280;
    --bg: #FAFAF9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 180px;
    height: auto;
    margin: 0 auto 28px;
    display: block;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: 0.5px;
  }
  .badge {
    display: inline-block;
    background: var(--coral);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  p.tagline {
    font-size: 16px;
    line-height: 1.6;
    color: var(--grey);
    margin: 0 0 32px;
  }
  .divider {
    width: 48px;
    height: 3px;
    background: var(--coral);
    border-radius: 2px;
    margin: 0 auto 32px;
  }
  .contact {
    font-size: 14px;
    color: var(--grey);
  }
  .contact a {
    color: var(--navy);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 2px solid var(--coral);
  }
  .contact a:hover {
    color: var(--coral);
  }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #A3A9B4;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <g id="sneaker">
          <path d="M8,58 C8,46 14,36 26,32 C42,24 58,14 74,10 C82,8 86,10 84,16
                   C92,26 102,34 114,36 C126,34 136,26 142,20 L167,16
                   C180,16 188,22 188,32 L188,58 Z"/>
          <path d="M40,30 L62,17 M50,38 L72,25" fill="none" stroke-linecap="round"/>
        </g>
      </defs>
      <g transform="translate(300,372)" stroke="#24344D" stroke-width="6" fill="none" stroke-linejoin="round">
        <use href="#sneaker" transform="scale(2.4)"/>
      </g>
      <rect x="300" y="542" width="480" height="16" rx="8" fill="#E1553A"/>
      <text x="540" y="640" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" fill="#24344D" text-anchor="middle" letter-spacing="2">SHOES</text>
      <text x="540" y="705" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" fill="#24344D" text-anchor="middle" letter-spacing="2">ON SALE</text>
    </svg>

    <span class="badge">Coming Soon</span>
    <h1>Shoes On Sale</h1>
    <div class="divider"></div>
    <p class="tagline">
      We're building a home for the best shoe deals and coupons from the brands
      you already shop — all in one place, updated regularly. Launching soon.
    </p>
    <p class="contact">
      Questions or partnership inquiries:<br />
      <a href="mailto:getshoesonsale@gmail.com">getshoesonsale@gmail.com</a>
    </p>
    <footer>&copy; 2026 Shoes On Sale. All rights reserved.</footer>
  </div>
</body>
</html>
